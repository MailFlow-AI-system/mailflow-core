services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mailflow-local
      MINIO_ROOT_PASSWORD: mailflow-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_MaxFileSize: 20M
      CLAMD_CONF_MaxRecursion: "10"
      CLAMD_CONF_MaxFiles: "10000"
      CLAMD_CONF_MaxScanTime: "25000"
      CLAMD_CONF_StreamMaxLength: 10M
      CLAMD_CONF_MaxThreads: "2"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  minio-data:
  clamav-data:
  postgres-data:
