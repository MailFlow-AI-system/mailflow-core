name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-required:
    name: CI Required
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
    services:
      database:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow
          POSTGRES_DB: mailflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Verify toolchain versions
        run: |
          test "$(node --version)" = "v$(<.node-version)"
          expected_bun_version="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).packageManager.split('@')[1])")"
          test "$(bun --version)" = "${expected_bun_version}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run required checks
        run: bun run check

      - name: Test migration installation, recovery, and concurrency
        env:
          MAILFLOW_MIGRATIONS_TEST_DATABASE_URL: postgresql://mailflow:mailflow@localhost:5432/mailflow
        run: bun run test src/shared/database/migrations.integration.test.ts

      - name: Smoke test production image
        run: bash scripts/smokeImage.sh
